packages:
  - "packages/joy-app"
  - "packages/joy-daemon"
  - "packages/joy-relay"
  - "packages/joy-mcp"
  - "packages/codium"

# Expo / React Native need a flat node_modules (Metro and native autolinking
# do not follow pnpm's isolated symlinks). The rest of what .npmrc used to set
# is pnpm 10's default.
nodeLinker: hoisted

# Wait seven days before resolving newly published dependencies, including
# transitive dependencies. pnpm measures this in minutes.
minimumReleaseAge: 10080
